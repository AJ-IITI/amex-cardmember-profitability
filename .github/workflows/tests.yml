name: Validate Python analysis
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.make_synthetic_demo --rows 300
      - run: python -m src.score_customers --data sample_data/synthetic_cardmembers.csv --output outputs/predictions.csv
      - run: python -m src.research --data sample_data/synthetic_cardmembers.csv --out outputs/research --clusters
